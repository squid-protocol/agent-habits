<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
<title id="title">A structural fingerprint can identify the generating model</title>
<desc id="desc">Exploratory nearest-neighbour result: 43 of 52 programs matched to a same-model nearest neighbour, compared with a 27 percent chance baseline. Median structural distance was 0.32 within a model and 0.62 between models for the same task and language.</desc>
<rect width="100%" height="100%" rx="18" fill="#101827"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#aab6c7}.white{fill:#f5f7fb}.small{font-size:15px}.label{font-size:17px}.headline{font-size:25px;font-weight:700}</style>
<text x="42" y="48" class="white headline">A structural fingerprint can carry a model signal</text>
<text x="42" y="78" class="muted small">Exploratory nearest-neighbour result · same task and language</text>
<text x="42" y="145" class="white label">Same-model nearest neighbour</text>
<rect x="300" y="121" width="530" height="27" rx="13" fill="#263347"/>
<rect x="300" y="121" width="438.3" height="27" rx="13" fill="#60d394"/>
<text x="842" y="143" class="white label" font-weight="700">83%</text>
<text x="300" y="172" class="muted small">43 of 52 programs</text>
<text x="42" y="229" class="white label">Chance baseline</text>
<rect x="300" y="205" width="530" height="27" rx="13" fill="#263347"/>
<rect x="300" y="205" width="143.6" height="27" rx="13" fill="#8492a6"/>
<text x="842" y="227" class="white label" font-weight="700">27%</text>
<text x="300" y="256" class="muted small">model mix in this sample</text>
<text x="42" y="325" class="white label" font-weight="700">Median structural distance</text>
<text x="42" y="354" class="white small">Same model  0.32</text>
<text x="300" y="354" class="white small">Different model  0.62</text>
<text x="42" y="390" class="muted small">Permutation p = 0.0005 · exploratory analysis; replication is still needed</text>
</svg>
